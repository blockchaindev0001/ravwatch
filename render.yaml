# Render blueprint for RAV Watch & Earn.
# In Render: New + -> Blueprint -> connect this repo. It reads this file.
services:
  - type: web
    name: ravwatch
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/config
    envVars:
      - key: COOKIE_SECURE
        value: "true"
      # A stable session secret so logins survive restarts. Render generates one:
      - key: SESSION_SECRET
        generateValue: true
      # Fill these in from Cloudflare -> Turnstile once you have the deployed URL:
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
    # NOTE: free tier has NO persistent disk, so data/db.json is ephemeral and
    # resets on redeploy. To keep points permanently, upgrade the plan and add:
    #   disk: { name: ravwatch-data, mountPath: /data, sizeGB: 1 }
    # and set env DATA_DIR=/data.
